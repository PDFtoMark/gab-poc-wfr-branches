name: Consumer
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
permissions: {}
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "LISTENER_FIRED"
          echo "head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "event=${{ github.event.workflow_run.event }}"
          echo "github_ref=${{ github.ref }}"
          echo "github_event_name=${{ github.event_name }}"
          echo "labels=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
